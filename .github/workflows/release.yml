name: Build and Release Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: windows-exe-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest "pyinstaller>=6.0"

      - name: Verify build tools
        shell: pwsh
        run: |
          python -m pytest --version
          pyinstaller --version

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Include i18n JSON locale tables inside the onefile bundle.
          # Windows --add-data uses semicolon: SRC;DEST_INSIDE_BUNDLE
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name EbookTranslator `
            --paths . `
            --add-data "src/i18n/en.json;src/i18n" `
            --add-data "src/i18n/zh-HK.json;src/i18n" `
            --hidden-import customtkinter `
            --hidden-import ebooklib `
            --hidden-import bs4 `
            --hidden-import lxml `
            --hidden-import PIL `
            --hidden-import openai `
            --collect-all customtkinter `
            src/main.py
          if (-not (Test-Path "dist/EbookTranslator.exe")) {
            throw "EXE build failed: dist/EbookTranslator.exe does not exist"
          }
          Get-Item "dist/EbookTranslator.exe" | Format-List Name, Length, FullName

      - name: Verify locale resources inside EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = @'
          from PyInstaller.archive.readers import CArchiveReader
          r = CArchiveReader(r"dist/EbookTranslator.exe")
          names = []
          toc = getattr(r, "toc", None) or getattr(r, "tocs", None)
          if isinstance(toc, dict):
              names = list(toc.keys())
          elif toc is not None:
              for entry in toc:
                  if isinstance(entry, (list, tuple)) and entry:
                      names.append(str(entry[0]))
                  else:
                      names.append(str(entry))
          print("--- archive entries containing i18n/json ---")
          hits = [n for n in names if "i18n" in n.replace("\\", "/").lower() or n.lower().endswith(".json")]
          for h in hits:
              print(h)
          need = ["zh-HK.json", "en.json"]
          missing = [n for n in need if not any(n in x.replace("\\", "/") for x in names)]
          if missing:
              raise SystemExit(f"Missing locale resources in EXE: {missing}")
          print("OK: en.json and zh-HK.json present in onefile archive")
          '@
          python -c $script

      - name: Verify i18n zh-HK without display
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "from src import i18n; i18n.set_language('zh-HK'); t=i18n.get('app_title'); assert t=='電子書翻譯工具', t; print('source zh-HK OK:', t)"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookTranslator-windows
          path: dist/EbookTranslator.exe
          if-no-files-found: error

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not determine project version from pyproject.toml"
          }
          Write-Host "version=$version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ steps.version.outputs.version }}"
          Write-Host "Release tag: $tag"

          gh release view $tag 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            Write-Host "Release $tag exists — uploading asset with --clobber"
            gh release upload $tag dist/EbookTranslator.exe --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed for $tag (exit $LASTEXITCODE)"
            }
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag dist/EbookTranslator.exe --title "Ebook Translator $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              Write-Host "create failed — retry with --existing-tag"
              gh release create $tag dist/EbookTranslator.exe --title "Ebook Translator $tag" --generate-notes --existing-tag
              if ($LASTEXITCODE -ne 0) {
                gh release view $tag 2>$null | Out-Null
                if ($LASTEXITCODE -eq 0) {
                  gh release upload $tag dist/EbookTranslator.exe --clobber
                  if ($LASTEXITCODE -ne 0) {
                    throw "gh release upload failed for $tag after concurrent create"
                  }
                } else {
                  throw "gh release create failed for $tag"
                }
              }
            }
          }

          Write-Host "Release $tag updated successfully"
