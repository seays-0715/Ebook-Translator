name: Build and Release Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: windows-exe-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest "pyinstaller>=6.0"

      - name: Verify build tools
        shell: pwsh
        run: |
          python -m pytest --version
          pyinstaller --version

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --noconfirm --clean --onefile --windowed --name EbookTranslator src/main.py
          if (-not (Test-Path "dist/EbookTranslator.exe")) {
            throw "EXE build failed: dist/EbookTranslator.exe does not exist"
          }
          Get-Item "dist/EbookTranslator.exe" | Format-List Name, Length, FullName

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookTranslator-windows
          path: dist/EbookTranslator.exe
          if-no-files-found: error

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not determine project version from pyproject.toml"
          }
          Write-Host "version=$version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ steps.version.outputs.version }}"
          Write-Host "Release tag: $tag"

          # Does a Release object already exist?
          gh release view $tag 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            Write-Host "Release $tag exists — uploading asset with --clobber"
            gh release upload $tag dist/EbookTranslator.exe --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed for $tag (exit $LASTEXITCODE)"
            }
          } else {
            Write-Host "Creating release $tag"
            # Tag may already exist without a Release; prefer --existing-tag fallback
            gh release create $tag dist/EbookTranslator.exe --title "Ebook Translator $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              Write-Host "create failed — retry with --existing-tag"
              gh release create $tag dist/EbookTranslator.exe --title "Ebook Translator $tag" --generate-notes --existing-tag
              if ($LASTEXITCODE -ne 0) {
                # Last resort: release may have been created by a concurrent run
                gh release view $tag 2>$null | Out-Null
                if ($LASTEXITCODE -eq 0) {
                  gh release upload $tag dist/EbookTranslator.exe --clobber
                  if ($LASTEXITCODE -ne 0) {
                    throw "gh release upload failed for $tag after concurrent create"
                  }
                } else {
                  throw "gh release create failed for $tag"
                }
              }
            }
          }

          Write-Host "Release $tag updated successfully"
