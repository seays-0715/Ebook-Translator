name: Build and Release Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0" 

      - name: Verify build tools
        shell: pwsh
        run: |
          python -m pytest --version
          pyinstaller --version

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name EbookTranslator src/main.py
          if (-not (Test-Path "dist/EbookTranslator.exe")) { throw "EXE build failed" }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not determine project version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/EbookTranslator.exe --clobber
          } else {
            gh release create $tag dist/EbookTranslator.exe --title "Ebook Translator $tag" --generate-notes
          }
